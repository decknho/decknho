<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="220" viewBox="0 0 1200 220">

  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="cyan">
      <stop stop-color="#087B90"/>
      <stop offset=".5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="shine">
      <stop stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E0FCFF"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34"
             patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none"
            stroke="#164E63" stroke-opacity=".26"/>
    </pattern>

    <clipPath id="clip">
      <rect x="10" y="10" width="1180" height="200" rx="24"/>
    </clipPath>

    <mask id="textMask">
      <rect width="1200" height="220" fill="black"/>
      <text x="600" y="135" text-anchor="middle"
            font-family="Arial,sans-serif"
            font-size="58" font-weight="bold"
            fill="white">
        Obrigado pela visita
      </text>
    </mask>
  </defs>

  <rect width="1200" height="220" rx="28" fill="#0D1117"/>

  <g clip-path="url(#clip)">

    <rect x="10" y="10" width="1180" height="200"
          fill="url(#bg)"/>

    <rect x="10" y="10" width="1180" height="200"
          fill="url(#grid)"/>

    <!-- Curva superior -->
    <path d="M-30 55 Q250 105 450 65 T850 75 T1230 105"
          fill="none" stroke="#087B90"
          stroke-width="2" opacity=".55"/>

    <path d="M-30 40 Q250 90 450 50 T850 60 T1230 90"
          fill="none" stroke="#06B6D4"
          stroke-width="2.5" stroke-dasharray="9 13">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-176"
               dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- Pontos luminosos -->
    <g fill="#67E8F9">
      <circle cx="150" cy="77" r="3">
        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle cx="410" cy="62" r="3">
        <animate attributeName="opacity"
                 values="1;.2;1"
                 dur="4s" repeatCount="indefinite"/>
      </circle>

      <circle cx="900" cy="76" r="3">
        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Estrela esquerda -->
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5
             L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"
          transform="translate(220 130)"
          fill="#06B6D4"/>

    <!-- Estrela direita -->
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5
             L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"
          transform="translate(980 130)"
          fill="#67E8F9"/>

    <!-- Texto principal -->
    <text x="600" y="135"
          text-anchor="middle"
          font-family="Arial,sans-serif"
          font-size="58"
          font-weight="bold"
          fill="#00c6e9">
      Obrigado pela visita
    </text>

    <!-- Brilho passando pelo texto -->
    <rect x="-100" y="75" width="75" height="80"
          fill="url(#shine)" mask="url(#textMask)">
      <animate attributeName="x"
               values="-100;1250"
               dur="5.8s" begin=".8s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Linha inferior -->
    <rect x="10" y="202" width="1180" height="8"
          fill="#164E63"/>

    <rect x="10" y="202" width="320" height="8"
          fill="url(#cyan)">
      <animate attributeName="width"
               values="240;520;240"
               dur="8s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>