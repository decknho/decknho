
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="50"
  viewBox="0 0 1200 50"
  fill="none"
>
  <defs>
    <linearGradient id="dividerGradient" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="20%" stop-color="#164E63" />
      <stop offset="40%" stop-color="#087B90" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#087B90" />
      <stop offset="80%" stop-color="#164E63" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Brilho suave -->
  <path
    d="M20 25 H1180"
    stroke="#06B6D4"
    stroke-width="5"
    opacity="0.35"
    filter="url(#glow)"
  />

  <!-- Linha principal -->
  <path
    d="M20 25 H1180"
    stroke="url(#dividerGradient)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Destaque central -->
  <ellipse
    cx="600"
    cy="25"
    rx="35"
    ry="12"
    fill="url(#centerGlow)"
  />

  <circle cx="600" cy="25" r="3.5" fill="#67E8F9" />
  <circle cx="600" cy="25" r="7"
    stroke="#06B6D4"
    stroke-width="1"
    opacity="0.5"
  />
</svg>
