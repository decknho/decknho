name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: decknho
          outputs: |
            dist/github-snake.svg?color_snake=06B6D4&color_dots=CFFAFE,A5F3FC,67E8F9,22D3EE,0891B2
            dist/github-snake-dark.svg?color_snake=06B6D4&color_dots=164E63,155E75,0E7490,0891B2,06B6D4

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
