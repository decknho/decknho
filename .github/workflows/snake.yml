name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: decknho
          outputs: |
            dist/github-snake.svg?color_snake=%2306B6D4&color_empty=%AEB4BA&color_dots=%23CFFAFE,%23A5F3FC,%2367E8F9,%2322D3EE,%230891B2
            dist/github-snake-dark.svg?color_snake=%2306B6D4&color_empty=%343A40&color_dots=%23164E63,%23155E75,%230E7490,%230891B2,%2306B6D4

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
